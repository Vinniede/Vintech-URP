name: Deploy URP to Cloudflare

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy API worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYMENT_CREDENTIALS_KEY: ${{ secrets.PAYMENT_CREDENTIALS_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: npx wrangler@4.127.1 deploy --config wrangler.toml

  deploy-admin:
    name: Deploy admin panel
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin app
        env:
          NEXT_PUBLIC_API_URL: https://unified-retail-api.vintech-urp.workers.dev
        run: pnpm --filter @urp/admin-panel build

      - name: Deploy admin app to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 pages deploy apps/admin-panel/.next \
            --project-name=vintech-urp-admin \
            --branch=master \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true

  deploy-console:
    name: Deploy platform console
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console app
        env:
          NEXT_PUBLIC_API_URL: https://unified-retail-api.vintech-urp.workers.dev
        run: pnpm --filter @urp/platform-console build

      - name: Deploy console app to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 pages deploy apps/platform-console/.next \
            --project-name=vintech-urp-console \
            --branch=master \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true

  deploy-storefront:
    name: Deploy storefront
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront app
        env:
          NEXT_PUBLIC_API_URL: https://unified-retail-api.vintech-urp.workers.dev
        run: pnpm --filter @urp/storefront build

      - name: Deploy storefront app to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 pages deploy apps/storefront/.next \
            --project-name=vintech-urp-storefront \
            --branch=master \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true

  deploy-pos:
    name: Deploy cashier POS
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build POS app
        env:
          VITE_API_URL: https://unified-retail-api.vintech-urp.workers.dev
        run: pnpm --filter @urp/cashier-pos build

      - name: Deploy POS app to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 pages deploy apps/cashier-pos/dist \
            --project-name=vintech-urp-pos \
            --branch=master \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true

  preview-pos:
    name: Preview cashier POS
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build POS preview
        env:
          VITE_API_URL: https://unified-retail-api.vintech-urp.workers.dev
        run: pnpm --filter @urp/cashier-pos build

      - name: Deploy POS preview to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 pages deploy apps/cashier-pos/dist \
            --project-name=vintech-urp-pos \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true
